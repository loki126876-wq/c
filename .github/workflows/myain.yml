name: BrH No-Root
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  crack:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Libs
        run: |
          pip install requests paramiko pymysql ftplib

      - name: Run Brody
        run: python3 brody_actions.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
