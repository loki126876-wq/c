name: Brody 6H Crack Engine
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  crack:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # ۶ ساعت دقیقاً
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Tools
        run: |
          sudo apt update
          sudo apt install -y nmap masscan hydra sshpass

      - name: Install Python Libs
        run: |
          pip install requests paramiko pymysql

      - name: Run Brody 6H Loop
        run: python3 brody_6h.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
